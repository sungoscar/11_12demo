{% extends "base.html" %}
{% block content %}
<section class="hero">
  <p class="eyebrow">從一篇好文章開始</p>
  <h1>讓投稿與審查，<br>各就其位。</h1>
  <p class="lead">作者與編輯共用一個登入入口，依照您的角色，進入專屬工作空間。</p>
  <a class="button" href="/login">登入工作空間 <span aria-hidden="true">→</span></a>
</section>
<div class="role-grid">
  <section class="card"><span class="step">01 / 作者</span><h2>專注於您的創作</h2><p>登入後進入作者首頁，開啟您的投稿旅程。</p></section>
  <section class="card"><span class="step">02 / 編輯</span><h2>為好內容把關</h2><p>登入後進入編輯首頁，使用專屬角色工作空間。</p></section>
</div>
{% endblock %}
